name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Production API URL
        env:
          PRODUCTION_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          if [ -n "$PRODUCTION_API_BASE_URL" ]; then
            echo "Injecting PRODUCTION_API_BASE_URL into frontend/config.js"
            sed -i "s|__PRODUCTION_API_BASE_URL__|${PRODUCTION_API_BASE_URL}|g" frontend/config.js
          else
            echo "::warning::Repository variable PRODUCTION_API_BASE_URL is not set. Using value in frontend/config.js."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
