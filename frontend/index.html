function render() {
  var app = document.getElementById("app");
  if (!state.user) return;

  var pageHtml = "";
  if (state.workspaceLoading) {
    pageHtml =
      '<div class="topbar"><div><div class="topbar-title">Memuat Workspace...</div><div class="topbar-sub">Mengambil dataset aktif &amp; riwayat dari Firebase Firestore</div></div></div>' +
      '<div class="content"><div class="card" style="text-align:center;padding:48px 24px;"><span class="spinner"></span><div style="margin-top:12px;font-weight:600;">Menyinkronkan data akun ' + esc(state.user.email) + '...</div><div style="font-size:12.5px;color:var(--muted);margin-top:4px;">Memeriksa activeDatasetId dan hasil forecasting tersimpan di Firebase.</div></div></div>';
  } else {
    if (state.page === "overview") pageHtml = renderOverview();
    else if (state.page === "material") pageHtml = renderDetail();
    else if (state.page === "forecast") pageHtml = renderForecast();
    else if (state.page === "data") pageHtml = renderData();
    else if (state.page === "datasets") pageHtml = renderDatasets();
    else if (state.page === "audit") pageHtml = renderAudit();
  }

  var banner = "";
  if (state.workspaceError) {
    banner += '<div class="callout err section"><span>&#9888;</span><span style="flex:1;">' + esc(state.workspaceError) + '</span><button class="btn-ghost btn-sm" data-action="retry-sync">Coba Lagi</button></div>';
  }
  if (state.localPreviewOnly) {
    banner += '<div class="callout warn section"><span>&#9888;</span><span><strong>MODE PREVIEW LOKAL (SEMENTARA)</strong> &mdash; data ini belum disimpan permanen ke Firebase. <button class="btn-danger-text" style="color:var(--accent);font-weight:600;" data-action="activate-dataset" data-id="baseline">Kembali ke Baseline Awal</button></span></div>';
  }
  if (banner) {
    pageHtml = pageHtml.replace('<div class="content">', '<div class="content">' + banner);
  }

  app.innerHTML = renderNav() + '<div class="main">' + pageHtml + '</div>';
  attachEvents();
}

function attachEvents() {
  var app = document.getElementById("app");

  var logoutBtn = app.querySelector('[data-action="logout"]');
  if (logoutBtn) logoutBtn.addEventListener("click", async function () {
    resetWorkspaceMemory();
    try {
      if (window.firebaseAuth && window.firebaseSignOut) await window.firebaseSignOut(window.firebaseAuth);
    } catch (e) { console.warn("Firebase sign-out gagal:", e); }
    renderLogin(null);
  });

  var retryBtn = app.querySelector('[data-action="retry-sync"]');
  if (retryBtn) retryBtn.addEventListener("click", function () {
    if (state.user) startWorkspaceSync(state.user);
  });

  app.querySelectorAll('[data-action="goto"]').forEach(function (el) {
    el.addEventListener("click", function () { state.page = el.getAttribute("data-page"); render(); });
  });
  app.querySelectorAll('[data-action="filter"]').forEach(function (el) {
    el.addEventListener("click", function () { state.filterClass = el.getAttribute("data-class"); render(); });
  });
  app.querySelectorAll('[data-action="select-detail"]').forEach(function (el) {
    el.addEventListener("click", function () { state.selected = el.getAttribute("data-code"); state.page = "material"; render(); });
  });

  var sel = app.querySelector('[data-action="change-material"]');
  if (sel) sel.addEventListener("change", function (e) { state.selected = e.target.value; render(); });

  ["ov-search", "fc-search"].forEach(function (searchId) {
    var el = document.getElementById(searchId);
    if (el) {
      el.addEventListener("input", function (e) {
        var pos = e.target.selectionStart;
        state.searchQuery = e.target.value;
        render();
        var nextInput = document.getElementById(searchId);
        if (nextInput) { nextInput.focus(); try { nextInput.setSelectionRange(pos, pos); } catch (ex) {} }
      });
    }
  });
  var ovLimit = document.getElementById("ov-limit");
  if (ovLimit) ovLimit.addEventListener("change", function (e) { state.pageLimit = Number(e.target.value); render(); });

  // Dataset management actions
  app.querySelectorAll('[data-action="activate-dataset"]').forEach(function (el) {
    el.addEventListener("click", function () { activateDataset(el.getAttribute("data-id")); });
  });
  app.querySelectorAll('[data-action="toggle-ds-detail"]').forEach(function (el) {
    el.addEventListener("click", function () {
      var id = el.getAttribute("data-id");
      state.detailDatasetId = state.detailDatasetId === id ? null : id;
      render();
    });
  });
  app.querySelectorAll('[data-action="download-ds"]').forEach(function (el) {
    el.addEventListener("click", function () {
      var id = el.getAttribute("data-id");
      var ds = state.datasets.find(function (d) { return d.datasetId === id; });
      if (ds) downloadOriginalDatasetFile(ds);
    });
  });
  app.querySelectorAll('[data-action="delete-ds"]').forEach(function (el) {
    el.addEventListener("click", function () {
      var id = el.getAttribute("data-id");
      var ds = state.datasets.find(function (d) { return d.datasetId === id; });
      if (ds) deleteDatasetWithConfirm(ds);
    });
  });

  // Backend Upload & Connection bindings
  bindBackend();

  // Offline CSV preview fallback
  var browseBtn = app.querySelector('[data-action="browse-csv"]');
  var csvInput = document.getElementById("csv-input");
  if (browseBtn && csvInput) {
    browseBtn.addEventListener("click", function () { csvInput.click(); });
    csvInput.addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) handleOfflineCsvPreview(e.target.files[0]);
    });
  }
}

function bindBackend() {
  var pick = document.getElementById("bb-pick"), inp = document.getElementById("bb-file");
  if (pick && inp) {
    pick.addEventListener("click", function () { inp.click(); });
    inp.addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) {
        var f = e.target.files[0];
        e.target.value = "";
        bbUploadAndValidate(f);
      }
    });
  }
  var zone = document.getElementById("bb-dropzone");
  if (zone) {
    zone.addEventListener("dragover", function (e) { e.preventDefault(); zone.classList.add("drag"); });
    zone.addEventListener("dragleave", function () { zone.classList.remove("drag"); });
    zone.addEventListener("drop", function (e) {
      e.preventDefault(); zone.classList.remove("drag");
      if (e.dataTransfer.files && e.dataTransfer.files[0]) bbUploadAndValidate(e.dataTransfer.files[0]);
    });
  }
  var checkBtn = document.getElementById("bb-check");
  if (checkBtn) {
    checkBtn.addEventListener("click", function () {
      var urlEl = document.getElementById("bb-url");
      bb.base = (urlEl ? urlEl.value.trim() : "").replace(/\/+$/, "");
      try {
        if (bb.base) localStorage.setItem(UI_PREF_API_KEY, bb.base);
        else localStorage.removeItem(UI_PREF_API_KEY);
      } catch (e) {}
      bbCheck();
    });
  }
  var resetUrlBtn = document.getElementById("bb-reset-url");
  if (resetUrlBtn) {
    resetUrlBtn.addEventListener("click", function () {
      try { localStorage.removeItem(UI_PREF_API_KEY); } catch (e) {}
      bb.base = defaultApiBase();
      var urlEl = document.getElementById("bb-url");
      if (urlEl) urlEl.value = bb.base;
      bbCheck();
    });
  }
  if (document.getElementById("bb-status")) {
    bbPaint();
    if (!bb.checked && !bb.busy) bbCheck();
  }
}

/* ============================================================
   OFFLINE CSV PREVIEW FALLBACK (NON-PERSISTENT)
   ============================================================ */
function loadPapaIfNeeded(callback) {
  if (window.Papa) { callback(); return; }
  var s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js";
  s.onload = callback;
  s.onerror = function () {
    var statusEl = document.getElementById("upload-status");
    if (statusEl) { statusEl.style.color = "var(--lumpy)"; statusEl.textContent = "Gagal memuat pembaca CSV dari CDN."; }
  };
  document.head.appendChild(s);
}

function handleOfflineCsvPreview(file) {
  var statusEl = document.getElementById("upload-status");
  if (statusEl) statusEl.textContent = "Memuat pembaca CSV...";
  loadPapaIfNeeded(function () {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function (results) {
        try {
          var grouped = {};
          results.data.forEach(function (r) {
            var kode = String(r.kode || r.Kode || r.stock_code || "").trim();
            var nama = String(r.nama || r.Nama || r.material || "").trim();
            var bulan = String(r.bulan || r.Bulan || r.periode || "").trim();
            var rawQty = String(r.qty !== undefined ? r.qty : (r.Qty !== undefined ? r.Qty : "")).trim().replace(",", ".");
            var qty = Number(rawQty);
            if (!kode || !/^\d{4}-(0[1-9]|1[0-2])$/.test(bulan) || rawQty === "" || !isFinite(qty) || qty < 0) return;
            if (!grouped[kode]) grouped[kode] = { name: nama || kode, map: {} };
            grouped[kode].map[bulan] = (grouped[kode].map[bulan] || 0) + qty;
          });
          var fresh = {};
          Object.keys(grouped).forEach(function (code) {
            var ks = Object.keys(grouped[code].map).sort();
            var a = monthToIndex(ks[0]), b = monthToIndex(ks[ks.length - 1]);
            var rows = [];
            for (var i = a; i <= b; i++) {
              var mo = indexToMonth(i);
              rows.push([mo, grouped[code].map[mo] === undefined ? 0 : grouped[code].map[mo]]);
            }
            if (rows.length >= 6 && rows.some(function (x) { return x[1] > 0; })) {
              fresh[code] = analyzeMaterialExcelVerified(grouped[code].name, rows);
            }
          });
          var ksFresh = Object.keys(fresh);
          if (!ksFresh.length) {
            if (statusEl) { statusEl.style.color = "var(--lumpy)"; statusEl.textContent = "Tidak ada material valid (min. 6 bulan, format YYYY-MM)."; }
            return;
          }
          state.materials = fresh;
          state.selected = ksFresh[0];
          state.localPreviewOnly = true;
          state.page = "overview";
          render();
          showToast("Preview lokal memuat " + ksFresh.length + " material (tidak disimpan ke Firebase).");
        } catch (err) {
          if (statusEl) { statusEl.style.color = "var(--lumpy)"; statusEl.textContent = "Gagal memproses CSV: " + err.message; }
        }
      }
    });
  });
}

/* ============================================================
   LOGIN GATE — FIREBASE EMAIL/PASSWORD
   ============================================================ */
function firebaseLoginErrorMessage(error) {
  var code = error && error.code ? error.code : "";
  if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") return "Email atau password salah.";
  if (code === "auth/invalid-email") return "Format email tidak valid.";
  if (code === "auth/too-many-requests") return "Terlalu banyak percobaan login. Coba lagi beberapa saat.";
  if (code === "auth/network-request-failed") return "Koneksi internet bermasalah. Periksa koneksi lalu coba lagi.";
  if (code === "auth/unauthorized-domain") return "Domain ini belum ditambahkan ke Authorized Domains di Firebase Authentication Console.";
  if (code === "auth/operation-not-allowed") return "Login Email/Password belum diaktifkan di Firebase Authentication.";
  return "Login gagal. " + (error && error.message ? error.message : "Terjadi kesalahan Firebase.");
}

function renderLogin(errorMsg) {
  var app = document.getElementById("app");
  app.innerHTML =
    '<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px;">' +
      '<div class="card" style="width:100%;max-width:390px;padding:32px 28px;">' +
        '<div style="text-align:center;margin-bottom:24px;">' +
          '<div style="font-size:18px;font-weight:800;">Forecast Studio</div>' +
          '<div style="font-size:12.5px;color:var(--muted);margin-top:4px;">Dashboard Forecasting Material &middot; Multi-Device Firebase Workspace</div>' +
        '</div>' +
        '<label class="field-label" for="auth-user">Email</label>' +
        '<input class="field" id="auth-user" type="email" style="width:100%;margin-bottom:14px;" placeholder="nama@email.com" autocomplete="username">' +
        '<label class="field-label" for="auth-pass">Password</label>' +
        '<input class="field" id="auth-pass" type="password" style="width:100%;margin-bottom:6px;" placeholder="Password" autocomplete="current-password">' +
        (errorMsg ? '<div style="color:var(--lumpy);font-size:12px;margin-top:6px;line-height:1.45;">' + esc(errorMsg) + '</div>' : '') +
        '<button class="btn" id="auth-submit" style="width:100%;margin-top:16px;">Masuk</button>' +
        '<div style="font-size:11px;color:var(--faint);margin-top:18px;text-align:center;line-height:1.5;">Setiap akun Firebase memiliki workspace, dataset aktif, dan riwayat forecasting terpisah yang otomatis tersinkron lintas perangkat.</div>' +
      '</div>' +
    '</div>';

  var emailEl = document.getElementById("auth-user");
  var passEl = document.getElementById("auth-pass");
  var submitEl = document.getElementById("auth-submit");

  async function attempt() {
    var email = emailEl.value.trim();
    var password = passEl.value;
    if (!email || !password) { renderLogin("Email dan password wajib diisi."); return; }

    submitEl.disabled = true;
    submitEl.textContent = "Memproses...";

    try {
      var fb = await window.__firebaseReady;
      if (!fb || !window.firebaseAuth) {
        var detail = window.firebaseInitError && window.firebaseInitError.message ? " Detail: " + window.firebaseInitError.message : "";
        renderLogin("Firebase Authentication belum berhasil terhubung." + detail);
        return;
      }
      await window.firebaseSignIn(window.firebaseAuth, email, password);
    } catch (err) {
      renderLogin(firebaseLoginErrorMessage(err));
    }
  }

  submitEl.addEventListener("click", attempt);
  passEl.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
  emailEl.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
}

/* ============================================================
   BOOT — AUTH STATE LISTENER
   ============================================================ */
document.getElementById("app").innerHTML =
  '<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:13px;"><span class="spinner" style="margin-right:10px;"></span>Memeriksa sesi Firebase...</div>';

window.__firebaseReady.then(function (fb) {
  if (!fb) {
    var detail = window.firebaseInitError && window.firebaseInitError.message ? " Detail: " + window.firebaseInitError.message : "";
    renderLogin("Firebase Authentication belum berhasil terhubung." + detail);
    return;
  }
  window.firebaseOnAuthStateChanged(fb.auth, function (user) {
    window.firebaseCurrentUser = user || null;
    if (user) {
      // Pastikan state akun sebelumnya benar-benar bersih sebelum memuat workspace akun baru
      resetWorkspaceMemory();
      startWorkspaceSync(user);
    } else {
      resetWorkspaceMemory();
      renderLogin(null);
    }
  });
});
</script>
</body>
</html>
